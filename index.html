
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAMSHIV AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: white;
        }

        header {
            padding: 22px 16px;
            text-align: center;
            background: #111c30;
            border-bottom: 1px solid #263650;
        }

        header h1 {
            margin: 0;
            color: #62d5ff;
        }

        header p {
            color: #a9bad0;
            margin-bottom: 0;
        }

        main {
            max-width: 700px;
            margin: auto;
            padding: 18px;
        }

        #chat {
            min-height: 300px;
            padding: 14px;
            background: #111c30;
            border-radius: 14px;
        }

        .message {
            padding: 12px;
            margin: 10px 0;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .bot {
            background: #20324b;
        }

        .user {
            background: #155e87;
            margin-left: 25px;
        }

        .input-area {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 1px solid #344760;
            border-radius: 10px;
            background: #17243a;
            color: white;
            font-size: 16px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: #36b9ed;
            color: #07111f;
            font-weight: bold;
        }

        footer {
            text-align: center;
            color: #8496ad;
            padding: 24px 10px;
        }
    </style>
</head>

<body>
    <header>
        <h1>⚡ VAMSHIV AI</h1>
        <p>Your Personal AI Assistant</p>
    </header>

    <main>
        <div id="chat">
            <div class="message bot">
                Hello! I'm VAMSHIV AI.
                Website ready! AI connection is our next step.
            </div>
        </div>

        <div class="input-area">
            <input id="question"
                   type="text"
                   placeholder="Ask VAMSHIV anything...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </main>

    <footer>
        VAMSHIV AI · Built by Vamsi
    </footer>

 
<script>
    async function sendMessage() {
        const input = document.getElementById("question");
        const text = input.value.trim();

        if (!text) return;

        const chat = document.getElementById("chat");

        // Show your message
        const userMessage = document.createElement("div");
        userMessage.className = "message user";
        userMessage.textContent = text;
        chat.appendChild(userMessage);

        input.value = "";

        // Show a temporary reply
        const botMessage = document.createElement("div");
        botMessage.className = "message bot";
        botMessage.textContent = "VAMSHIV is thinking...";
        chat.appendChild(botMessage);

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    question: text
                })
            });

            if (!response.ok) {
                throw new Error("Server error");
            }

            const data = await response.json();
            botMessage.textContent =
                data.answer || "No reply received.";

        } catch (error) {
            botMessage.textContent =
                "Connection failed. Check whether Flask is running.";
        }

        chat.scrollTop = chat.scrollHeight;
    }

    // Send message when you press Enter
    document.getElementById("question")
        .addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
</script>

</body>
</html>
